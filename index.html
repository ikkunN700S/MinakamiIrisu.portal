<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水上イリス ポータルサイト</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-titles">
                <h1>水上イリス Portal</h1>
                <p>Latest Activities</p>
            </div>
            
            <div class="header-socials">
                <!-- X (旧Twitter) -->
                <a href="https://x.com/MinakamiIrisu_i" target="_blank" rel="noopener noreferrer" title="X (Twitter)">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
                <!-- YouTube -->
                <a href="https://www.youtube.com/@MinakamiIrisu" target="_blank" rel="noopener noreferrer" title="YouTube">
                    <i class="fa-brands fa-youtube"></i>
                </a>
                <!-- 公式サイト (地球儀アイコン) -->
                <a href="https://minakamiirisu.wixsite.com/minakamiirisu" target="_blank" rel="noopener noreferrer" title="Official Website">
                    <i class="fa-solid fa-globe"></i>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="section">
            <h2 class="section-title">Latest Videos</h2>
            <div id="youtube-feed" class="horizontal-scroll">
                <p class="loading">読み込み中...</p>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">MUSIC VIDEO</h2>
            <div id="playlist-feed" class="horizontal-scroll">
                <p class="loading">読み込み中...</p>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">ニコニコ動画</h2>
            <div id="niconico-feed" class="horizontal-scroll">
                <p class="loading">読み込み中...</p>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Blog Posts</h2>
            <div id="blog-feed" class="horizontal-scroll">
                <p class="loading">読み込み中...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 水上イリス / ICCHAMA</p>
        <p id="site-version"></p>
    </footer>

    <script src="script.js"></script>
    <script src="niconico.js"></script>
    <script src="version.js"></script>
</body>
</html>
